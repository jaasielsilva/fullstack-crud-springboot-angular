# ============================================================
# CI — roda em PRs e pushes para dev/main
# Faz build + testes do backend e frontend SEM publicar imagens.
# Deploy é feito pelos workflows deploy-hml/deploy-prod.
# ============================================================
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: start
          title: "CI iniciado"
          message: "Evento: ${{ github.event_name }}"

  # ----------------------------------------------------------
  backend:
    name: Backend (Maven build + tests)
    runs-on: ubuntu-latest
    needs: notify-start
    defaults:
      run:
        working-directory: backend/clientes-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        run: ./mvnw -B -e -ntp clean verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/clientes-api/target/*.jar
          retention-days: 7

  # ----------------------------------------------------------
  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    needs: notify-start
    defaults:
      run:
        working-directory: frontend/clientes-front-v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/clientes-front-v2/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (production)
        run: npx ng build --configuration=production

  # ----------------------------------------------------------
  notify-result:
    name: Notify result
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Compute status
        id: s
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=CI passou" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=CI falhou" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.s.outputs.status }}
          title: ${{ steps.s.outputs.title }}
          message: |
            Backend: ${{ needs.backend.result }}
            Frontend: ${{ needs.frontend.result }}

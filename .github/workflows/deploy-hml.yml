# ============================================================
# DEPLOY HML — branch dev
# 1) Build das imagens Docker (api e web)
# 2) Push no GHCR com tags :hml e :hml-<sha>
# 3) SSH na VPS e atualiza o stack /opt/erpcorporativo/hml
# 4) Notifica Telegram em cada etapa (start/success/failure)
#
# Cache Buildx: chaves FIXAS buildx-hml-api / buildx-hml-web (isolado de PROD).
# ============================================================
name: Deploy HML

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-hml
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/erpcorporativo-api
  IMAGE_WEB: ${{ github.repository_owner }}/erpcorporativo-web
  TAG_ENV: hml
  BUILDX_CACHE_API: /tmp/.buildx-cache-hml-api
  BUILDX_CACHE_API_NEW: /tmp/.buildx-cache-hml-api-new
  BUILDX_CACHE_WEB: /tmp/.buildx-cache-hml-web
  BUILDX_CACHE_WEB_NEW: /tmp/.buildx-cache-hml-web-new

jobs:
  # ----------------------------------------------------------
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: start
          title: "Deploy HML iniciado"
          message: "Branch dev → ambiente https://dev.erpcorporativo.shop"

  # ----------------------------------------------------------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: notify-start
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Buildx local cache dirs
        run: |
          mkdir -p "${{ env.BUILDX_CACHE_API }}" "${{ env.BUILDX_CACHE_WEB }}"
          rm -rf "${{ env.BUILDX_CACHE_API_NEW }}" "${{ env.BUILDX_CACHE_WEB_NEW }}"

      - name: Restore Buildx cache (API, HML)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILDX_CACHE_API }}
          key: buildx-hml-api
          restore-keys: |
            buildx-hml-api-

      - name: Restore Buildx cache (Web, HML)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILDX_CACHE_WEB }}
          key: buildx-hml-web
          restore-keys: |
            buildx-hml-web-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: backend/clientes-api
          file: backend/clientes-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ env.TAG_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ env.TAG_ENV }}-${{ steps.meta.outputs.sha_short }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_API }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_API_NEW }},mode=max

      - name: Rotate Buildx cache (API)
        if: success()
        run: |
          rm -rf "${{ env.BUILDX_CACHE_API }}"
          if [ -d "${{ env.BUILDX_CACHE_API_NEW }}" ]; then
            mv "${{ env.BUILDX_CACHE_API_NEW }}" "${{ env.BUILDX_CACHE_API }}"
          else
            mkdir -p "${{ env.BUILDX_CACHE_API }}"
          fi

      - name: Save Buildx cache (API, HML)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILDX_CACHE_API }}
          key: buildx-hml-api

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/clientes-front-v2
          file: frontend/clientes-front-v2/Dockerfile
          build-args: |
            BUILD_CONFIG=hml
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ env.TAG_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ env.TAG_ENV }}-${{ steps.meta.outputs.sha_short }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_WEB }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_WEB_NEW }},mode=max

      - name: Rotate Buildx cache (Web)
        if: success()
        run: |
          rm -rf "${{ env.BUILDX_CACHE_WEB }}"
          if [ -d "${{ env.BUILDX_CACHE_WEB_NEW }}" ]; then
            mv "${{ env.BUILDX_CACHE_WEB_NEW }}" "${{ env.BUILDX_CACHE_WEB }}"
          else
            mkdir -p "${{ env.BUILDX_CACHE_WEB }}"
          fi

      - name: Save Buildx cache (Web, HML)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILDX_CACHE_WEB }}
          key: buildx-hml-web

      - name: Prune BuildKit builder cache
        if: always()
        run: docker builder prune -af || true

  # ----------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      GMUD_API_URL: https://api.dev.erpcorporativo.shop
      GMUD_ENVIRONMENT: HML
    steps:
      - name: GMUD - deploy start
        id: gmud_start
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then
            echo "GMUD_NOTIFY=true" >> "$GITHUB_ENV"
            echo "GMUD_NOTIFY_MSG=GMUD_DEPLOY_TOKEN não configurado no GitHub" >> "$GITHUB_ENV"
            exit 0
          fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --arg title "Deploy HML ${GITHUB_REF_NAME}@${SHA}" \
            --arg version "$SHA" \
            --arg artifact "ghcr.io/${{ github.repository_owner }}/erpcorporativo-api:hml-${SHA}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "GitHub Actions deploy-hml" \
            '{environment: $env, title: $title, version: $version, artifact: $artifact, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          HTTP=$(curl -sS -o /tmp/gmud-start.json -w "%{http_code}" -X POST \
            "${GMUD_API_URL}/api/internal/gmud/deploy-events/start" \
            -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          if [ "$HTTP" != "200" ]; then
            echo "GMUD_NOTIFY=true" >> "$GITHUB_ENV"
            echo "GMUD_NOTIFY_MSG=Falha ao registrar início GMUD (HTTP ${HTTP})" >> "$GITHUB_ENV"
          else
            CHANGE_ID=$(jq -r '.changeId // empty' /tmp/gmud-start.json)
            echo "change_id=${CHANGE_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: GMUD - Telegram aviso (start)
        if: env.GMUD_NOTIFY == 'true'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: "GMUD HML — aviso"
          message: "${{ env.GMUD_NOTIFY_MSG }}"

      - name: SSH deploy
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            export GIT_TERMINAL_PROMPT=0
            cd /opt/erpcorporativo/repo
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
            cp deploy/hml/docker-compose.yml /opt/erpcorporativo/hml/docker-compose.yml
            cd /opt/erpcorporativo/hml
            export COMPOSE_HTTP_TIMEOUT=300
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "docker compose pull failed after 5 attempts (GHCR rede/timeout?)"
                exit 1
              fi
              echo "Pull falhou (tentativa $attempt/5), aguardando 25s..."
              sleep 25
            done
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: GMUD - deploy success
        if: steps.ssh_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then exit 0; fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          CHANGE_ID="${{ steps.gmud_start.outputs.change_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --argjson changeId "${CHANGE_ID:-null}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "Deploy HML concluído" \
            '{environment: $env, changeId: $changeId, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          HTTP=$(curl -sS -o /tmp/gmud-success.json -w "%{http_code}" -X POST \
            "${GMUD_API_URL}/api/internal/gmud/deploy-events/success" \
            -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          if [ "$HTTP" != "200" ]; then
            echo "GMUD_NOTIFY=true" >> "$GITHUB_ENV"
            echo "GMUD_NOTIFY_MSG=Falha ao registrar sucesso GMUD (HTTP ${HTTP})" >> "$GITHUB_ENV"
          fi

      - name: GMUD - Telegram aviso (success)
        if: env.GMUD_NOTIFY == 'true' && steps.ssh_deploy.outcome == 'success'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: "GMUD HML — aviso"
          message: "${{ env.GMUD_NOTIFY_MSG }}"

      - name: GMUD - deploy failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then exit 0; fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          CHANGE_ID="${{ steps.gmud_start.outputs.change_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --argjson changeId "${CHANGE_ID:-null}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "Falha no deploy HML (GitHub Actions)" \
            '{environment: $env, changeId: $changeId, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          curl -sS -X POST "${GMUD_API_URL}/api/internal/gmud/deploy-events/failure" \
            -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

  # ----------------------------------------------------------
  notify-result:
    name: Notify result
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Compute status
        id: s
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=Deploy HML concluído" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=Deploy HML falhou" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.s.outputs.status }}
          title: ${{ steps.s.outputs.title }}
          message: |
            Build: ${{ needs.build-and-push.result }}
            Deploy: ${{ needs.deploy.result }}
            URL: https://dev.erpcorporativo.shop
            API: https://api.dev.erpcorporativo.shop

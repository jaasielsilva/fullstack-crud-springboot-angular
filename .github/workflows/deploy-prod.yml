# ============================================================
# DEPLOY PROD — branch main
# 1) Build das imagens Docker (api e web)
# 2) Push no GHCR com tags :prod e :prod-<sha>
# 3) SSH na VPS e atualiza o stack /opt/erpcorporativo/prod
# 4) Notifica Telegram em cada etapa (start/success/failure)
#
# Cache Buildx: diretórios locais + actions/cache com chaves FIXAS
# (buildx-prod-api / buildx-prod-web) — sem github.sha na chave.
# Rotação cache-to → *-new → mv evita corrupção; save sobrescreve o artefato.
# ============================================================
name: Deploy PROD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/erpcorporativo-api
  IMAGE_WEB: ${{ github.repository_owner }}/erpcorporativo-web
  TAG_ENV: prod
  # Isolado de HML — nunca compartilhar paths/chaves com outro ambiente
  BUILDX_CACHE_API: /tmp/.buildx-cache-prod-api
  BUILDX_CACHE_API_NEW: /tmp/.buildx-cache-prod-api-new
  BUILDX_CACHE_WEB: /tmp/.buildx-cache-prod-web
  BUILDX_CACHE_WEB_NEW: /tmp/.buildx-cache-prod-web-new

jobs:
  # ----------------------------------------------------------
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: start
          title: "Deploy PROD iniciado"
          message: "Branch main → ambiente https://erpcorporativo.shop"

  # ----------------------------------------------------------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: notify-start
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Buildx local cache dirs
        run: |
          mkdir -p "${{ env.BUILDX_CACHE_API }}" "${{ env.BUILDX_CACHE_WEB }}"
          rm -rf "${{ env.BUILDX_CACHE_API_NEW }}" "${{ env.BUILDX_CACHE_WEB_NEW }}"

      - name: Restore Buildx cache (API, PROD)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILDX_CACHE_API }}
          key: buildx-prod-api
          restore-keys: |
            buildx-prod-api-

      - name: Restore Buildx cache (Web, PROD)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILDX_CACHE_WEB }}
          key: buildx-prod-web
          restore-keys: |
            buildx-prod-web-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: backend/clientes-api
          file: backend/clientes-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ env.TAG_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ env.TAG_ENV }}-${{ steps.meta.outputs.sha_short }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_API }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_API_NEW }},mode=max

      - name: Rotate Buildx cache (API)
        if: success()
        run: |
          rm -rf "${{ env.BUILDX_CACHE_API }}"
          if [ -d "${{ env.BUILDX_CACHE_API_NEW }}" ]; then
            mv "${{ env.BUILDX_CACHE_API_NEW }}" "${{ env.BUILDX_CACHE_API }}"
          else
            mkdir -p "${{ env.BUILDX_CACHE_API }}"
          fi

      - name: Save Buildx cache (API, PROD)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILDX_CACHE_API }}
          key: buildx-prod-api

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: frontend/clientes-front-v2
          file: frontend/clientes-front-v2/Dockerfile
          build-args: |
            BUILD_CONFIG=production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ env.TAG_ENV }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ env.TAG_ENV }}-${{ steps.meta.outputs.sha_short }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_WEB }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_WEB_NEW }},mode=max

      - name: Rotate Buildx cache (Web)
        if: success()
        run: |
          rm -rf "${{ env.BUILDX_CACHE_WEB }}"
          if [ -d "${{ env.BUILDX_CACHE_WEB_NEW }}" ]; then
            mv "${{ env.BUILDX_CACHE_WEB_NEW }}" "${{ env.BUILDX_CACHE_WEB }}"
          else
            mkdir -p "${{ env.BUILDX_CACHE_WEB }}"
          fi

      - name: Save Buildx cache (Web, PROD)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILDX_CACHE_WEB }}
          key: buildx-prod-web

      - name: Prune BuildKit builder cache
        if: always()
        run: docker builder prune -af || true

  # ----------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://erpcorporativo.shop
    env:
      GMUD_API_URL: https://api.erpcorporativo.shop
      GMUD_APP_URL: https://erpcorporativo.shop
      GMUD_ENVIRONMENT: PROD
      GMUD_APPROVAL_POLL_INTERVAL_SEC: 30
      GMUD_APPROVAL_POLL_MAX_MINUTES: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GitHub Release for commit
        id: release_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          CREATED="false"

          if [ -z "${TAG}" ]; then
            LATEST="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -z "${LATEST}" ]; then
              TAG="v0.1.0"
            else
              VER="${LATEST#v}"
              IFS=. read -r MAJOR MINOR PATCH <<< "${VER}"
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
            git tag -a "${TAG}" -m "Release ${TAG} — deploy PROD (${GITHUB_SHA:0:7})"
            git push origin "${TAG}"
            CREATED="true"
            echo "Tag ${TAG} criada automaticamente no commit ${GITHUB_SHA}."
          else
            echo "Tag existente no commit: ${TAG}"
          fi

          HTTP=$(curl -sS -o /tmp/release-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || echo "000")
          if [ "${HTTP}" != "200" ]; then
            NOTES="Deploy PROD automático — commit ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})."
            if [ "${CREATED}" = "true" ]; then
              NOTES="${NOTES} Tag e release geradas pelo pipeline."
            else
              NOTES="${NOTES} Release criada pelo pipeline (tag já existia)."
            fi
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --notes "${NOTES}"
            echo "GitHub Release ${TAG} criada."
          else
            echo "GitHub Release ${TAG} já existe."
          fi

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_auto_created=${CREATED}" >> "$GITHUB_OUTPUT"

      - name: GMUD - deploy start
        id: gmud_start
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then
            echo "GMUD_DEPLOY_TOKEN não configurado no GitHub."
            exit 1
          fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --arg title "Deploy PROD ${GITHUB_REF_NAME}@${SHA}" \
            --arg version "${{ steps.release_guard.outputs.release_tag }}" \
            --arg artifact "ghcr.io/${{ github.repository_owner }}/erpcorporativo-api:prod-${SHA}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "GitHub Actions deploy-prod — aguarda aprovação manual" \
            '{environment: $env, title: $title, version: $version, artifact: $artifact, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          HTTP=$(curl -sS -o /tmp/gmud-start.json -w "%{http_code}" -X POST \
            "${GMUD_API_URL}/api/internal/gmud/deploy-events/start" \
            -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")
          if [ "$HTTP" != "200" ]; then
            echo "Falha ao registrar início GMUD PROD (HTTP ${HTTP})."
            exit 1
          fi
          CHANGE_ID=$(jq -r '.changeId // empty' /tmp/gmud-start.json)
          STATUS=$(jq -r '.status // empty' /tmp/gmud-start.json)
          echo "change_id=${CHANGE_ID}" >> "$GITHUB_OUTPUT"
          echo "gmud_status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: GMUD - Telegram aguardando aprovação
        if: steps.gmud_start.outputs.gmud_status != 'APPROVED'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: start
          title: "GMUD PROD — aguardando aprovação"
          message: "Change: #${{ steps.gmud_start.outputs.change_id }} | Status: ${{ steps.gmud_start.outputs.gmud_status }} | Release: ${{ steps.release_guard.outputs.release_tag }}. Pipeline aguarda até ${GMUD_APPROVAL_POLL_MAX_MINUTES} min. Faça login como super admin e toque no link abaixo."
          link_url: ${{ env.GMUD_APP_URL }}/gmud/${{ steps.gmud_start.outputs.change_id }}
          link_label: "Aprovar GMUD #${{ steps.gmud_start.outputs.change_id }}"

      - name: GMUD - aguardar aprovação (polling)
        id: gmud_poll
        if: steps.gmud_start.outputs.gmud_status != 'APPROVED'
        run: |
          set -euo pipefail
          CHANGE_ID="${{ steps.gmud_start.outputs.change_id }}"
          RUN_ID="${{ github.run_id }}"
          MAX_SECONDS=$((GMUD_APPROVAL_POLL_MAX_MINUTES * 60))
          ELAPSED=0
          echo "GMUD #${CHANGE_ID} aguardando APPROVED (até ${GMUD_APPROVAL_POLL_MAX_MINUTES} min, intervalo ${GMUD_APPROVAL_POLL_INTERVAL_SEC}s)..."

          POLL_PAYLOAD=$(jq -n \
            --argjson changeId "${CHANGE_ID}" \
            --arg env "$GMUD_ENVIRONMENT" \
            --arg runId "${RUN_ID}" \
            '{changeId: $changeId, environment: $env, pipelineRunId: $runId}')

          while [ "${ELAPSED}" -lt "${MAX_SECONDS}" ]; do
            HTTP=$(curl -sS -o /tmp/gmud-status.json -w "%{http_code}" \
              "${GMUD_API_URL}/api/internal/gmud/deploy-events/status/${RUN_ID}" \
              -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" || echo "000")
            if [ "${HTTP}" != "200" ]; then
              HTTP=$(curl -sS -o /tmp/gmud-status.json -w "%{http_code}" -X POST \
                "${GMUD_API_URL}/api/internal/gmud/deploy-events/start" \
                -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
                -H "Content-Type: application/json" \
                -d "${POLL_PAYLOAD}" || echo "000")
            fi
            if [ "${HTTP}" = "200" ]; then
              STATUS=$(jq -r '.status // empty' /tmp/gmud-status.json)
              echo "[${ELAPSED}s] Status GMUD #${CHANGE_ID}: ${STATUS}"
              if [ "${STATUS}" = "APPROVED" ]; then
                echo "gmud_status=APPROVED" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "${STATUS}" = "ROLLBACK" ] || [ "${STATUS}" = "DEPLOYED" ]; then
                echo "GMUD em status inesperado para deploy: ${STATUS}"
                exit 1
              fi
            else
              echo "[${ELAPSED}s] Falha ao consultar status (HTTP ${HTTP})."
            fi
            sleep "${GMUD_APPROVAL_POLL_INTERVAL_SEC}"
            ELAPSED=$((ELAPSED + GMUD_APPROVAL_POLL_INTERVAL_SEC))
          done

          echo "Timeout: GMUD #${CHANGE_ID} não aprovada em ${GMUD_APPROVAL_POLL_MAX_MINUTES} minutos."
          exit 1

      - name: GMUD - Telegram timeout aprovação
        if: failure() && steps.gmud_poll.outcome == 'failure'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: "GMUD PROD — timeout de aprovação"
          message: "Change: #${{ steps.gmud_start.outputs.change_id }} | Release: ${{ steps.release_guard.outputs.release_tag }}. Aprovação não recebida em ${GMUD_APPROVAL_POLL_MAX_MINUTES} min. Aprove na GMUD e reexecute o workflow."
          link_url: ${{ env.GMUD_APP_URL }}/gmud/${{ steps.gmud_start.outputs.change_id }}
          link_label: "Abrir GMUD #${{ steps.gmud_start.outputs.change_id }}"

      - name: SSH deploy
        id: ssh_deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            export GIT_TERMINAL_PROMPT=0
            cd /opt/erpcorporativo/repo
            git fetch origin
            git checkout main
            git reset --hard origin/main
            cp deploy/prod/docker-compose.yml /opt/erpcorporativo/prod/docker-compose.yml
            cd /opt/erpcorporativo/prod
            export COMPOSE_HTTP_TIMEOUT=300
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "docker compose pull failed after 5 attempts (GHCR rede/timeout?)"
                exit 1
              fi
              echo "Pull falhou (tentativa $attempt/5), aguardando 25s..."
              sleep 25
            done
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: GMUD - deploy success
        if: steps.ssh_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then exit 0; fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          CHANGE_ID="${{ steps.gmud_start.outputs.change_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --argjson changeId "${CHANGE_ID:-null}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "Deploy PROD concluído (requer GMUD APPROVED)" \
            '{environment: $env, changeId: $changeId, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          HTTP="000"
          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -sS -o /tmp/gmud-success.json -w "%{http_code}" -X POST \
              "${GMUD_API_URL}/api/internal/gmud/deploy-events/success" \
              -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "GMUD success registrado na tentativa ${attempt}."
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Falha ao registrar sucesso GMUD (HTTP ${HTTP}) na tentativa ${attempt}/5. Aguardando 10s..."
              sleep 10
            fi
          done
          if [ "$HTTP" != "200" ]; then
            echo "GMUD_NOTIFY=true" >> "$GITHUB_ENV"
            echo "GMUD_NOTIFY_MSG=Falha ao registrar sucesso GMUD PROD (HTTP ${HTTP}) após 5 tentativas. Aprove a GMUD na UI se necessário." >> "$GITHUB_ENV"
          fi

      - name: GMUD - Telegram aviso (success)
        if: env.GMUD_NOTIFY == 'true' && steps.ssh_deploy.outcome == 'success'
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: "GMUD PROD — aviso"
          message: "${{ env.GMUD_NOTIFY_MSG }}"

      - name: GMUD - deploy failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.GMUD_DEPLOY_TOKEN }}" ]; then exit 0; fi
          SHA="${{ needs.build-and-push.outputs.sha_short }}"
          CHANGE_ID="${{ steps.gmud_start.outputs.change_id }}"
          PAYLOAD=$(jq -n \
            --arg env "$GMUD_ENVIRONMENT" \
            --argjson changeId "${CHANGE_ID:-null}" \
            --arg runId "${{ github.run_id }}" \
            --arg sha "$SHA" \
            --arg comment "Falha no deploy PROD (GitHub Actions)" \
            '{environment: $env, changeId: $changeId, pipelineRunId: $runId, commitSha: $sha, comment: $comment}')
          curl -sS -X POST "${GMUD_API_URL}/api/internal/gmud/deploy-events/failure" \
            -H "X-Deploy-Token: ${{ secrets.GMUD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

  # ----------------------------------------------------------
  notify-result:
    name: Notify result
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Compute status
        id: s
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ] && [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=Deploy PROD concluído" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=Deploy PROD falhou" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ steps.s.outputs.status }}
          title: ${{ steps.s.outputs.title }}
          message: |
            Build: ${{ needs.build-and-push.result }}
            Deploy: ${{ needs.deploy.result }}
            URL: https://erpcorporativo.shop
            API: https://api.erpcorporativo.shop

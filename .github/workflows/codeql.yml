# ============================================================
# CodeQL — análise estática de segurança (Java + TypeScript)
# Ativa "Alertas de leitura de código" em Settings → Security.
# ============================================================
name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze-java:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/clientes-api
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build for CodeQL
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  analyze-javascript:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/clientes-front-v2
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths:
              - frontend/clientes-front-v2
            paths-ignore:
              - frontend/clientes-front-v2/node_modules
              - frontend/clientes-front-v2/dist

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/clientes-front-v2/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for CodeQL
        run: npx ng build --configuration=production

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

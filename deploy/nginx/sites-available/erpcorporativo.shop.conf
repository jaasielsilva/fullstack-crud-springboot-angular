# ============================================================
# Nginx no HOST — proxy reverso para os containers LexCRM
#
# Portas internas (docker bind em 127.0.0.1):
#   api-hml     → 9101
#   web-hml     → 9102
#   api-prod    → 9103
#   web-prod    → 9104
#
# Coloque este arquivo em:
#   /etc/nginx/sites-available/erpcorporativo.shop.conf
# E habilite:
#   ln -sf /etc/nginx/sites-available/erpcorporativo.shop.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Depois emita certificado Let's Encrypt (uma linha):
#   certbot --nginx -d erpcorporativo.shop -d www.erpcorporativo.shop \
#     -d api.erpcorporativo.shop -d dev.erpcorporativo.shop -d api.dev.erpcorporativo.shop
#
# O Certbot injeta os blocos ssl_* automaticamente.
# ============================================================

# Subdomínios antigos do teste adegaflow — podem ser removidos de sites-enabled se não usar mais

server {
    listen 80;
    server_name api.dev.erpcorporativo.shop;

    location / {
        proxy_pass http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    client_max_body_size 50M;
}

server {
    listen 80;
    server_name dev.erpcorporativo.shop;

    location / {
        proxy_pass http://127.0.0.1:9102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.erpcorporativo.shop;

    location / {
        proxy_pass http://127.0.0.1:9103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    client_max_body_size 50M;
}

server {
    listen 80;
    server_name www.erpcorporativo.shop;
    return 301 http://erpcorporativo.shop$request_uri;
}

server {
    listen 80;
    server_name erpcorporativo.shop;

    location / {
        proxy_pass http://127.0.0.1:9104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

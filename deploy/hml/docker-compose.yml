# ============================================================
# Stack de HOMOLOGAÇÃO
# Frontend: https://dev.erpcorporativo.shop   → container web-hml
# API:      https://api.dev.erpcorporativo.shop → container api-hml
#
# TLS é terminado pelo Nginx do HOST (portas 80/443 já em uso).
# Os serviços ficam só em 127.0.0.1 — não conflita com lavarapido (:8080/:8081).
# ============================================================
services:
  mysql-hml:
    image: mysql:8.0
    container_name: mysql-hml
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_hml_data:/var/lib/mysql
    networks:
      - internal-hml
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-hml:
    image: ${API_IMAGE}
    container_name: api-hml
    restart: unless-stopped
    depends_on:
      mysql-hml:
        condition: service_healthy
    environment:
      ENV: hml
      SPRING_PROFILES_ACTIVE: hml
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_HOST: mysql-hml
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: https://dev.erpcorporativo.shop
      # update = mantém dados entre restarts da API; create = DROP + recria tabelas a cada subida (só reset controlado).
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Trial / Mercado Pago (ver deploy/hml/.env.example e docs/19-trial-assinatura-mercadopago.md)
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://dev.erpcorporativo.shop}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-https://api.dev.erpcorporativo.shop/api/webhooks/mercadopago}
      MERCADO_PAGO_PREFER_SANDBOX: ${MERCADO_PAGO_PREFER_SANDBOX:-true}
      # Opcional: ex. 1.00 — defina no .env (ver deploy/hml/.env.example). Sem a variável = preço real.
      MERCADO_PAGO_CHECKOUT_VALOR_OVERRIDE: ${MERCADO_PAGO_CHECKOUT_VALOR_OVERRIDE:-}
      MERCADO_PAGO_LOG_PREFERENCE_PAYLOAD: ${MERCADO_PAGO_LOG_PREFERENCE_PAYLOAD:-false}
      MERCADO_PAGO_LOG_PREFERENCE_RESPONSE: ${MERCADO_PAGO_LOG_PREFERENCE_RESPONSE:-false}
      MERCADO_PAGO_LOG_WEBHOOK_INBOUND: ${MERCADO_PAGO_LOG_WEBHOOK_INBOUND:-false}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_PRODUCT_ID_BASICO: ${ABACATEPAY_PRODUCT_ID_BASICO:-}
      ABACATEPAY_PRODUCT_ID_PREMIUM: ${ABACATEPAY_PRODUCT_ID_PREMIUM:-}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
      ABACATEPAY_WEBHOOK_HMAC_KEY: ${ABACATEPAY_WEBHOOK_HMAC_KEY:-}
      DATADOG_WEBHOOK_SECRET: ${DATADOG_WEBHOOK_SECRET:-}
      DATADOG_WEBHOOK_ALLOWED_IPS: ${DATADOG_WEBHOOK_ALLOWED_IPS:-}
      DATADOG_WEBHOOK_LOG_PAYLOAD_PREVIEW: ${DATADOG_WEBHOOK_LOG_PAYLOAD_PREVIEW:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CONNECT_TIMEOUT_MS: ${TELEGRAM_CONNECT_TIMEOUT_MS:-2000}
      TELEGRAM_SEND_TIMEOUT_MS: ${TELEGRAM_SEND_TIMEOUT_MS:-5000}
      GMUD_DEPLOY_TOKEN: ${GMUD_DEPLOY_TOKEN:-}
      GMUD_ENABLED: ${GMUD_ENABLED:-true}
    networks:
      - internal-hml
    ports:
      # Nginx do host faz proxy_pass para esta porta (loopback apenas)
      - "127.0.0.1:${HOST_PORT_API_HML:-9101}:8080"

  web-hml:
    image: ${WEB_IMAGE}
    container_name: web-hml
    restart: unless-stopped
    depends_on:
      - api-hml
    networks:
      - internal-hml
    ports:
      - "127.0.0.1:${HOST_PORT_WEB_HML:-9102}:80"

volumes:
  mysql_hml_data:

networks:
  internal-hml:
    driver: bridge

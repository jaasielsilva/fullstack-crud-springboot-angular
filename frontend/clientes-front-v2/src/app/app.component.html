<ng-container *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</ng-container>

<ng-container *ngIf="!isLoginPage">
  <div class="app-wrapper">

    <!-- Sidebar Lateral -->
    <aside class="sidebar shadow-sm">
      <div class="sidebar-header">
        <span class="brand-text">
          <i class="bi bi-box-seam me-2"></i>LexCRM
        </span>
      </div>

      <div class="sidebar-body p-3">
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
              <i class="bi bi-grid-1x2"></i>
              Painel Geral
            </a>
          </li>
          <li class="nav-item mt-2">
            <small class="text-muted fw-bold px-3 text-uppercase" style="font-size: 0.75rem;">Módulos</small>
          </li>
          <li class="nav-item">
            <a routerLink="/clientes" routerLinkActive="active" class="nav-link">
              <i class="bi bi-people"></i>
              Clientes
            </a>
          </li>
          <li class="nav-item" *ngIf="canAccess(['ADMIN'])">
            <a routerLink="/usuarios" routerLinkActive="active" class="nav-link">
              <i class="bi bi-person-gear"></i>
              Usuários
            </a>
          </li>
          <li class="nav-item" *ngIf="canAccessSuperAdmin()">
            <a routerLink="/empresas" routerLinkActive="active" class="nav-link">
              <i class="bi bi-buildings"></i>
              Empresas
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/produtos" routerLinkActive="active" class="nav-link">
              <i class="bi bi-box2"></i>
              Produtos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/pedidos" routerLinkActive="active" class="nav-link">
              <i class="bi bi-cart-check"></i>
              Pedidos
            </a>
          </li>
          <li class="nav-item" *ngIf="canAccess(['ADMIN'])">
            <a routerLink="/configuracoes" routerLinkActive="active" class="nav-link">
              <i class="bi bi-gear"></i>
              Configurações
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer p-3 mt-auto border-top">
        <button (click)="sair()"
          class="btn btn-outline-danger w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 fw-bold shadow-sm py-2">
          <i class="bi bi-box-arrow-left"></i>
          <span>Sair do Sistema</span>
        </button>
        <div class="text-center mt-2">
          <span class="text-muted" style="font-size: 0.65rem;">Versão 1.0</span>
        </div>
      </div>
    </aside>

    <!-- Container Direito (Topbar + Conteúdo) -->
    <div class="right-wrapper">

      <!-- Topbar Global -->
      <header class="topbar bg-white shadow-sm px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm btn-light d-lg-none me-3"><i class="bi bi-list"></i></button>
          <div class="input-group input-group-sm" style="width: 250px;">
            <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control bg-light border-0 shadow-none" placeholder="Buscar no sistema...">
          </div>
        </div>

        <div class="d-flex align-items-center gap-3">
          <button
            class="btn btn-light position-relative rounded-circle p-0 d-flex align-items-center justify-content-center"
            style="width: 32px; height: 32px;">
            <i class="bi bi-bell text-secondary" style="font-size: 1.1rem;"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
          </button>

          <div class="vr mx-1 bg-secondary opacity-25" style="height: 24px; align-self: center;"></div>

          <div class="dropdown">
            <div class="d-flex align-items-center gap-2 cursor-pointer" data-bs-toggle="dropdown" aria-expanded="false"
              style="cursor: pointer;">
              <div class="text-end d-none d-md-block">
                <h6 class="mb-0 fw-bold" style="font-size: 0.85rem;">{{ getUser().sub }}</h6>
                <small class="text-muted" style="font-size: 0.7rem;">{{ getUser().role }}</small>
              </div>
              <div
                class="avatar bg-primary text-white fw-bold rounded-circle d-flex align-items-center justify-content-center text-uppercase"
                style="width: 36px; height: 36px; font-size: 0.9rem;">
                {{ getUser().sub.substring(0, 1) }}
              </div>
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
              <li class="px-3 py-2 border-bottom d-md-none">
                <h6 class="mb-0 fw-bold small">{{ getUser().sub }}</h6>
                <small class="text-muted small">{{ getUser().role }}</small>
              </li>
              <li><a class="dropdown-item py-2 text-danger fw-bold" href="javascript:void(0)" (click)="sair()">
                  <i class="bi bi-box-arrow-right me-2"></i>Sair do Sistema
                </a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Onde as outras telas vão renderizar -->
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>

    </div>

  </div>
</ng-container>

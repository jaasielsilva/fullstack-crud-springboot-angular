<div class="login-container d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card premium-card border-0 shadow-lg p-5 animate__animated animate__fadeIn" style="max-width: 450px; width: 100%;">
        
        <div class="text-center mb-4">
            <div class="icon-circle bg-warning-subtle text-warning mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle" style="width: 70px; height: 70px;">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Primeiro Acesso</h3>
            <p class="text-muted small">Por segurança, você deve definir uma nova senha para continuar acessando o sistema.</p>
        </div>

        <div *ngIf="error" class="alert alert-danger border-0 small py-2 mb-4 animate__animated animate__shakeX">
            <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
        </div>

        <form (ngSubmit)="confirmar()">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Nova Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-key-fill text-muted"></i></span>
                    <input type="password" class="form-control bg-light border-0" [(ngModel)]="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Confirmar Nova Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="bi bi-check-circle-fill text-muted"></i></span>
                    <input type="password" class="form-control bg-light border-0" [(ngModel)]="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm" [disabled]="loading">
                <span *ngIf="!loading">Atualizar e Entrar</span>
                <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
            </button>
        </form>
    </div>
</div>

<!-- MODAL DE SUCESSO PADRONIZADO -->
<app-confirm-modal
    [isOpen]="showSuccessModal"
    title="Senha Atualizada!"
    message="Sua nova senha foi salva com sucesso. Por favor, realize o login novamente para acessar o sistema."
    confirmText="Ir para Login"
    [showCancel]="false"
    (confirm)="handleModalConfirm()">
</app-confirm-modal>

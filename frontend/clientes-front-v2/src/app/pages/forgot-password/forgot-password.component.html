<div class="recovery-wrapper">
    <div class="recovery-container shadow-lg">
        <div class="text-center mb-4">
            <div class="logo-circle mx-auto mb-3">
                <i class="bi bi-shield-lock-fill text-white fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Recuperar Senha</h3>
            <p class="text-muted small">
                {{ etapa === 'SOLICITAR' ? 'Insira seu e-mail para receber o código.' : 'Insira o código enviado e sua nova senha.' }}
            </p>
        </div>

        <div class="alert alert-success border-0 py-2" *ngIf="mensagemSucesso">
            <small class="fw-semibold"><i class="bi bi-check-circle me-1"></i> {{ mensagemSucesso }}</small>
        </div>

        <div class="alert alert-danger border-0 py-2" *ngIf="mensagemErro">
            <small class="fw-semibold"><i class="bi bi-exclamation-circle me-1"></i> {{ mensagemErro }}</small>
        </div>

        <!-- ETAPA 1: Solicitar Código -->
        <form *ngIf="etapa === 'SOLICITAR'" (ngSubmit)="solicitarCodigo()">
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold mb-1">E-mail Cadastrado</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0 ps-0" 
                           [(ngModel)]="email" name="email" placeholder="seu@email.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm" [disabled]="carregando || !email">
                <span *ngIf="!carregando">Enviar Código de Recuperação</span>
                <span *ngIf="carregando" class="spinner-border spinner-border-sm"></span>
            </button>
        </form>

        <!-- ETAPA 2: Redefinir Senha -->
        <form *ngIf="etapa === 'REDEFINIR'" (ngSubmit)="redefinirSenha()">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold mb-1">Código de 6 dígitos</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-hash"></i></span>
                    <input type="text" class="form-control bg-light border-start-0 ps-0" 
                           [(ngModel)]="token" name="token" placeholder="000000" maxlength="6" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold mb-1">Nova Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0 ps-0" 
                           [(ngModel)]="novaSenha" name="novaSenha" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold py-2 shadow-sm" [disabled]="carregando || !token || !novaSenha">
                <span *ngIf="!carregando">Alterar Senha</span>
                <span *ngIf="carregando" class="spinner-border spinner-border-sm"></span>
            </button>
            
            <button type="button" class="btn btn-link w-100 mt-2 text-decoration-none small" (click)="etapa = 'SOLICITAR'">
                Reenviar e-mail
            </button>
        </form>

        <div class="mt-4 text-center">
            <a routerLink="/login" class="text-primary small text-decoration-none fw-bold">
                <i class="bi bi-arrow-left me-1"></i> Voltar para o Login
            </a>
        </div>
    </div>
</div>

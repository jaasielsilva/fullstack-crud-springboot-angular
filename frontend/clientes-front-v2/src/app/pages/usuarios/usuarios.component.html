<div class="container-fluid dashboard-container">
    
    <!-- Cabeçalho da Página -->
    <div class="d-flex align-items-end justify-content-between mb-3 border-bottom pb-2">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-gear fs-4 text-primary"></i>
            <h4 class="fw-bold text-dark mb-0">Gestão de Usuários</h4>
        </div>
        <button class="btn btn-sm btn-primary rounded-pill fw-bold px-3 shadow-sm" (click)="abrirNovo()">
            <i class="bi bi-plus-lg me-1"></i> Inserir
        </button>
    </div>

    <div class="card premium-card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 custom-table">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4 py-3 text-secondary small fw-bold">NOME / USERNAME</th>
                        <th class="py-3 text-secondary small fw-bold">E-MAIL (LOGIN)</th>
                        <th class="py-3 text-secondary small fw-bold">NÍVEL DE ACESSO</th>
                        <th class="py-3 text-secondary small fw-bold text-end pe-4">AÇÕES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let u of usuarios">
                        <td class="ps-4">
                            <div class="d-flex align-items-center">
                                <div class="avatar bg-primary-subtle text-primary fw-bold rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 38px; height: 38px;">
                                    {{ u.username.substring(0,1).toUpperCase() }}
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold small text-dark">{{ u.username }}</h6>
                                </div>
                            </div>
                        </td>
                        <td><span class="text-secondary small">{{ u.login }}</span></td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2 fw-bold" 
                                  [ngClass]="u.role === 'ADMIN' ? 'bg-danger-subtle text-danger' : 'bg-info-subtle text-info'">
                                <i class="bi" [ngClass]="u.role === 'ADMIN' ? 'bi-shield-lock-fill' : 'bi-person-fill'"></i>
                                {{ u.role }}
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group shadow-sm rounded-pill bg-light overflow-hidden">
                                <button class="btn btn-sm btn-light text-primary border-0" (click)="editar(u)" title="Editar">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-sm btn-light text-danger border-0" (click)="excluir(u.id)" title="Excluir">
                                    <i class="bi bi-trash3-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- OFFCANVAS BACKGROUND -->
<div class="custom-offcanvas-backdrop" [class.show]="mostrarForm" (click)="fecharForm()"></div>

<!-- OFFCANVAS FORM (Painel Lateral) -->
<div class="custom-offcanvas" [class.show]="mostrarForm">
    <div class="p-4 border-bottom d-flex justify-content-between align-items-center bg-light">
        <div class="d-flex align-items-center gap-2">
            <div class="icon-circle-sm bg-primary-subtle text-primary d-flex align-items-center justify-content-center rounded-circle" style="width: 32px; height: 32px;">
                <i class="bi" [class.bi-person-plus-fill]="!isEditando" [class.bi-pencil-square]="isEditando"></i>
            </div>
            <h5 class="mb-0 fw-bold text-dark">{{ isEditando ? 'Editar Usuário' : 'Novo Usuário' }}</h5>
        </div>
        <button type="button" class="btn-close" (click)="fecharForm()"></button>
    </div>
    
    <div class="offcanvas-body p-4">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">E-mail (Login)</label>
            <input type="email" class="form-control bg-light border-0" [(ngModel)]="usuarioSelecionado.login" name="login" placeholder="exemplo@lexcrm.com.br" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Nome de Usuário (Username)</label>
            <input type="text" class="form-control bg-light border-0" [(ngModel)]="usuarioSelecionado.username" name="username" placeholder="nome.sobrenome" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Senha {{ isEditando ? '(Vazio para manter)' : '' }}</label>
            <input type="password" class="form-control bg-light border-0" [(ngModel)]="usuarioSelecionado.senha" name="senha" placeholder="••••••••">
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Nível de Acesso</label>
            <select class="form-select bg-light border-0" [(ngModel)]="usuarioSelecionado.role" name="role">
                <option value="USER">Usuário (Padrão)</option>
                <option value="ADMIN">Administrador (Total)</option>
            </select>
        </div>
    </div>

    <div class="p-4 border-top bg-white">
        <button class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm py-2" (click)="salvar()">
            <i class="bi me-2" [class.bi-check2]="isEditando" [class.bi-plus-lg]="!isEditando"></i>
            {{ isEditando ? 'Salvar Alterações' : 'Inserir' }}
        </button>
    </div>
</div>

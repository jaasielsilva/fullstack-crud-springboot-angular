<div class="container-fluid dashboard-container">
  <!-- Cabeçalho da Página Compacto -->
  <div class="d-flex align-items-end justify-content-between mb-3 border-bottom pb-2">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-grid-1x2 fs-4 text-primary"></i>
      <h4 class="fw-bold text-dark mb-0">Painel Geral</h4>
    </div>
    <small class="text-muted d-none d-md-block">Visão estratégica do seu negócio</small>
  </div>

  <!-- Loading spinner (mostra enquanto os dados não chegam) -->
  <div *ngIf="carregando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <!-- Cards (Mostra apenas quando carregar terminar) -->
  <div *ngIf="!carregando" class="row g-3">
    
    <!-- Card de Clientes -->
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="card premium-card border-0 shadow-sm h-100">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="card-title text-secondary fw-bold mb-0">Total de Clientes</h6>
            <div class="icon-circle bg-primary-subtle text-primary">
              <i class="bi bi-people-fill"></i>
            </div>
          </div>
          <!-- Texto menor com fs-2 ao invés de display-4 -->
          <h2 class="fs-2 fw-bold text-dark mb-0">{{ totalClientes }}</h2>
          <p class="text-muted mb-0"><small style="font-size: 0.75rem;">clientes registrados</small></p>
        </div>
        <div class="card-footer bg-transparent border-0 px-3 pb-3 mt-auto">
          <a routerLink="/clientes" class="btn btn-sm btn-outline-primary w-100 rounded-pill">Gerenciar</a>
        </div>
      </div>
    </div>

    <!-- Card de Produtos -->
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="card premium-card border-0 shadow-sm h-100 bg-primary text-white">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="card-title text-light fw-bold mb-0">Total de Produtos</h6>
            <div class="icon-circle bg-white text-primary">
              <i class="bi bi-box-seam-fill"></i>
            </div>
          </div>
          <h2 class="fs-2 fw-bold text-white mb-0">{{ totalProdutos }}</h2>
          <p class="text-light mb-0"><small style="font-size: 0.75rem;">produtos no catálogo</small></p>
        </div>
        <div class="card-footer border-0 px-3 pb-3 mt-auto" style="background: transparent;">
          <a routerLink="/produtos" class="btn btn-sm btn-light w-100 rounded-pill fw-bold text-primary">Acessar</a>
        </div>
      </div>
    </div>

  </div>
</div>

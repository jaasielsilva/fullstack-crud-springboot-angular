<div class="auth-shell d-flex align-items-center justify-content-center min-vh-100 bg-light px-3">
  <div class="card shadow-sm border-0" style="max-width: 480px; width: 100%">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="h4 fw-bold mb-1">Começar grátis por 7 dias</h1>
        <p class="text-muted small mb-0">Sem cartão de crédito. Teste o ERP Corporativo completo.</p>
      </div>

      <div *ngIf="erro" class="alert alert-danger small py-2">{{ erro }}</div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Nome da empresa</label>
        <input class="form-control" [(ngModel)]="form.nomeEmpresa" name="nomeEmpresa" autocomplete="organization" />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nome do responsável</label>
        <input class="form-control" [(ngModel)]="form.nomeResponsavel" name="nomeResponsavel" autocomplete="name" />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">E-mail</label>
        <input type="email" class="form-control" [(ngModel)]="form.email" name="email" autocomplete="email" />
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Telefone</label>
        <input class="form-control" [(ngModel)]="form.telefone" name="telefone" autocomplete="tel" />
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Senha</label>
        <input type="password" class="form-control" [(ngModel)]="form.senha" name="senha" autocomplete="new-password" />
      </div>

      <button type="button" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" [disabled]="carregando" (click)="enviar()">
        <span *ngIf="!carregando">Criar conta trial</span>
        <span *ngIf="carregando">Aguarde...</span>
      </button>

      <p class="text-center text-muted small mt-4 mb-0">
        Já tem conta?
        <a routerLink="/login" class="fw-semibold text-decoration-none">Entrar</a>
      </p>
    </div>
  </div>
</div>

<div class="container py-5">

  <!-- Alerta -->
  <div *ngIf="mensagem" class="alert alert-dismissible fade show"
       [class.alert-success]="tipoMensagem === 'success'"
       [class.alert-danger]="tipoMensagem === 'danger'"
       role="alert">
    {{ mensagem }}
    <button type="button" class="btn-close" (click)="mensagem = ''"></button>
  </div>

  <!-- Formulário -->
  <div class="card shadow-sm mb-4">
    <div class="card-header">
      <h5 class="mb-0">{{ editandoId ? 'Editar Cliente' : 'Novo Cliente' }}</h5>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nome <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="form.nome" placeholder="Nome completo">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control" [(ngModel)]="form.email" placeholder="email@exemplo.com">
        </div>
        <div class="col-md-6">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" [(ngModel)]="form.telefone" placeholder="(00) 00000-0000">
        </div>
        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="ativo" [(ngModel)]="form.ativo">
            <label class="form-check-label" for="ativo">Ativo</label>
          </div>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" (click)="salvar()">
          {{ editandoId ? 'Atualizar' : 'Cadastrar' }}
        </button>
        <button *ngIf="editandoId" class="btn btn-outline-secondary" (click)="resetar()">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <!-- Lista -->
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Clientes cadastrados</h5>
      <span class="badge bg-secondary">{{ clientes.length }}</span>
    </div>
    <div class="card-body p-0">

      <div *ngIf="carregando" class="text-center py-4 text-muted">Carregando...</div>

      <div *ngIf="!carregando && clientes.length === 0" class="text-center py-4 text-muted">
        Nenhum cliente cadastrado ainda.
      </div>

      <table *ngIf="!carregando && clientes.length > 0" class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Status</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of clientes">
            <td>{{ c.nome }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.telefone || '—' }}</td>
            <td>
              <span class="badge"
                    [class.bg-success]="c.ativo"
                    [class.bg-secondary]="!c.ativo">
                {{ c.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" (click)="editar(c)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deletar(c.id!)">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

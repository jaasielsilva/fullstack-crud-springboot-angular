<ng-container *ngIf="snapshot as s">
  <div *ngIf="s.empresaStatus === 'TRIAL' && s.diasTrialRestantes !== null && s.diasTrialRestantes !== undefined"
       class="alert alert-info trial-banner mb-0 rounded-0 border-0 d-flex align-items-center justify-content-between flex-wrap gap-2"
       role="status">
    <span>
      <i class="bi bi-hourglass-split me-2"></i>
      Seu teste grátis termina em <strong>{{ s.diasTrialRestantes }}</strong>
      {{ s.diasTrialRestantes === 1 ? 'dia' : 'dias' }}.
    </span>
    <a routerLink="/planos" class="btn btn-sm btn-dark">Ver planos</a>
  </div>

  <div *ngIf="s.pagamentoPendente"
       class="alert alert-warning mb-0 rounded-0 border-0 py-2 small"
       role="status">
    <i class="bi bi-clock-history me-2"></i>
    {{ s.mensagemPagamentoPendente || 'Pagamento em análise.' }}
  </div>
</ng-container>

<ng-container *ngIf="isOpen">
    <div class="modal-backdrop fade show d-block"></div>

    <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content premium-modal border-0 shadow-lg animate__animated animate__zoomIn animate__faster">
                
                <div class="modal-body p-4 text-center">
                    <!-- Ícone Dinâmico baseado no tipo -->
                    <div class="icon-container mb-4 mx-auto" [ngClass]="'bg-' + type + '-subtle text-' + type">
                        <i class="bi" [ngClass]="{
                            'bi-exclamation-triangle-fill': type === 'danger' || type === 'warning',
                            'bi-info-circle-fill': type === 'info'
                        }" style="font-size: 2.5rem;"></i>
                    </div>

                    <h4 class="fw-bold text-dark mb-2">{{ title }}</h4>
                    <p class="text-muted mb-0 px-3">{{ message }}</p>
                </div>

                <div class="modal-footer border-0 p-4 pt-0 gap-2 justify-content-center">
                    <button *ngIf="showCancel" type="button" class="btn btn-light rounded-pill px-4 fw-bold py-2 border shadow-sm" (click)="onCancel()">
                        {{ cancelText }}
                    </button>
                    <button type="button" class="btn rounded-pill px-4 fw-bold py-2 shadow-sm" 
                            [ngClass]="'btn-' + type"
                            (click)="onConfirm()">
                        {{ confirmText }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</ng-container>

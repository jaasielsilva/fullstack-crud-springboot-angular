# ============================================================
# Configuração só para testes — H2 in-memory, sem dependência de MySQL
# Usado automaticamente pelo Spring Boot quando rodando em src/test
# ============================================================
spring.application.name=clientes-api-test
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:clientes_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desliga inicializador de dados em testes (depende de tenants pré-existentes)
app.data-initializer.enabled=false

# Segredo dummy para o TokenService bootar
api.security.token.secret=test-secret-only

# Desliga mail em testes
spring.mail.host=localhost
spring.mail.port=25

# Mercado Pago / front — exigidos por beans @Value no contexto completo (CI sem .env)
app.frontend-url=http://localhost:4200
mercadopago.access-token=test-mp-access-token
mercadopago.notification-url=http://localhost:8080/api/webhooks/mercadopago
mercadopago.prefer-sandbox-init-point=true

# Cron do job de trial (obrigatório para @Scheduled em TrialService)
app.trial.verification-cron=0 0 0 1 1 ?

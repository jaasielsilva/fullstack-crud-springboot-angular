# Homologação — frontend em https://dev.erpcorporativo.shop
# Mercado Pago: URLs públicas HTTPS (nunca localhost com token de produção). Sobrescreva via env no deploy.
app.frontend-url=${APP_FRONTEND_URL:https://dev.erpcorporativo.shop}
mercadopago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:https://api.dev.erpcorporativo.shop/api/webhooks/mercadopago}
mercadopago.prefer-sandbox-init-point=${MERCADO_PAGO_PREFER_SANDBOX:false}

# Sem Kubernetes: probes agregam liveness/readiness e o /actuator/health costuma ficar 503 OUT_OF_SERVICE mesmo com a API ok.
management.endpoint.health.probes.enabled=false
management.endpoint.health.show-details=always

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.com.clientes_api=DEBUG

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://dev.erpcorporativo.shop}

spring.devtools.restart.enabled=false

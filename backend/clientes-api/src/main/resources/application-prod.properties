# Produção — frontend em https://erpcorporativo.shop (e opcionalmente www)

management.endpoint.health.probes.enabled=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=WARN
logging.level.com.clientes_api=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://erpcorporativo.shop,https://www.erpcorporativo.shop}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.devtools.restart.enabled=false

# Endpoints de teste de monitoring desligados em produção
monitoring.test-endpoints.enabled=false

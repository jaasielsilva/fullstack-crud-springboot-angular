spring.application.name=clientes-api

# Profile ativo (default = dev local). Em containers definir via SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ================================================
# Banco MySQL (defaults para desenvolvimento local)
# Em containers, sobrescreva via env: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clientes_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# show-sql escreve no stdout e mistura com SLF4J no console (linhas corrompidas). Use JPA_LOG_SQL.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
logging.level.org.hibernate.SQL=${JPA_LOG_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${JPA_LOG_BIND:WARN}

# Porta da aplicação
server.port=${SERVER_PORT:8080}

# CORS — origens do frontend (CSV). Inclui Angular em dev (porta 4200). Produção/hml: sobrescreva com APP_CORS_ALLOWED_ORIGINS se precisar.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://erpcorporativo.shop,https://dev.erpcorporativo.shop,http://localhost:4200,http://127.0.0.1:4200}

# JWT
api.security.token.secret=${JWT_SECRET:troque-esta-chave-em-producao}

# Mail (defaults vazios para evitar falha de boot quando não usado)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator — só health/info expostos publicamente
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Healthcheck do mail desligado por padrão (evita DOWN quando SMTP não está configurado).
# Quando MAIL_USERNAME/MAIL_PASSWORD estiverem preenchidos, defina MAIL_HEALTH_ENABLED=true no .env
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Frontend (URLs de retorno Mercado Pago)
app.frontend-url=${APP_FRONTEND_URL:https://erpcorporativo.shop}

# Job verificação trial expirado (cron Spring 6 campos: segundo minuto hora dia mês dia-da-semana)
app.trial.verification-cron=${APP_TRIAL_VERIFICATION_CRON:0 */15 * * * *}

# Super admin da plataforma (sobrescreva via env em produção)
app.admin.email=${APP_ADMIN_EMAIL:admin@lexcrm.com.br}
app.admin.senha=${APP_ADMIN_SENHA:admin@LexCRM2025}

# Mercado Pago — token apenas no servidor (nunca no Angular)
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:https://api.erpcorporativo.shop/api/webhooks/mercadopago}
mercadopago.prefer-sandbox-init-point=${MERCADO_PAGO_PREFER_SANDBOX:false}

# Homologação: marcar true para ADMIN/GERENTE simularem pagamento de pedido sem Mercado Pago (nunca em produção).
app.pedido-simular-pagamento=${APP_PEDIDO_SIMULAR_PAGAMENTO:false}

